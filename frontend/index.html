<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HiveRift · Intelligence Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0f1117;
  --surface:   #1a1d27;
  --surface2:  #22263a;
  --border:    rgba(255,255,255,0.07);
  --accent:    #00e67a;
  --accent-dim:#00c266;
  --text:      #e8eaf0;
  --text-muted:#6b7280;
  --text-soft: #9ca3af;
  --user-bg:   #1e2235;
  --radius:    18px;
  --font:      'DM Sans', sans-serif;
  --mono:      'DM Mono', monospace;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  overflow: hidden;
}

/* ── Layout ─────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
  max-width: 860px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ── Header ─────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 4px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 34px;
  height: 34px;
  background: var(--accent);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.logo-icon svg { display: block; }

.logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.logo-text span:first-child {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}

.logo-text span:last-child {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-soft);
  background: var(--surface);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  animation: statusPulse 2.5s ease-in-out infinite;
}

@keyframes statusPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.btn-ghost:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Messages ───────────────────────────────────────────── */
.messages {
  overflow-y: auto;
  padding: 28px 4px;
  display: flex;
  flex-direction: column;
  gap: 0;
  scroll-behavior: smooth;
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

/* ── Message row ────────────────────────────────────────── */
.msg-row {
  display: flex;
  gap: 14px;
  padding: 10px 0;
  animation: msgIn 0.2s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-row.user {
  flex-direction: row-reverse;
}

/* avatar */
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  margin-top: 2px;
}

.avatar.bot {
  background: var(--accent);
  color: #000;
  font-size: 11px;
  letter-spacing: -0.02em;
}

.avatar.user {
  background: var(--surface2);
  color: var(--text-soft);
}

/* bubble */
.bubble {
  max-width: min(680px, 82%);
  padding: 13px 17px;
  border-radius: var(--radius);
  font-size: 14.5px;
  line-height: 1.72;
  word-break: break-word;
}

.bubble.bot {
  background: transparent;
  color: var(--text);
  padding-left: 4px;
  padding-right: 4px;
  border-radius: 0;
}

.bubble.user {
  background: var(--user-bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-right-radius: 6px;
}

/* ── Markdown inside bot bubble ─────────────────────────── */
.bubble.bot strong { color: var(--text); font-weight: 600; }
.bubble.bot em { color: var(--text-soft); font-style: italic; }
.bubble.bot code {
  font-family: var(--mono);
  font-size: 13px;
  background: var(--surface2);
  padding: 2px 6px;
  border-radius: 5px;
  color: var(--accent);
}
.bubble.bot ul, .bubble.bot ol {
  padding-left: 20px;
  margin: 8px 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.bubble.bot li { color: var(--text); }
.bubble.bot p { margin: 6px 0; }
.bubble.bot p:first-child { margin-top: 0; }
.bubble.bot p:last-child { margin-bottom: 0; }

/* ── Streaming cursor ───────────────────────────────────── */
.streaming-cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: text-bottom;
  border-radius: 1px;
  animation: cursorBlink 0.6s step-end infinite;
}

@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* ── Thinking animation ─────────────────────────────────── */
.thinking {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 4px;
  height: 28px;
}

.thinking span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: thinkDot 1.4s ease-in-out infinite;
}
.thinking span:nth-child(1) { animation-delay: 0s; }
.thinking span:nth-child(2) { animation-delay: 0.2s; }
.thinking span:nth-child(3) { animation-delay: 0.4s; }

@keyframes thinkDot {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ── Phase pill ─────────────────────────────────────────── */
.phase-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  background: rgba(0,230,122,0.08);
  border: 1px solid rgba(0,230,122,0.2);
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 10px;
  margin-left: 46px;
  animation: msgIn 0.2s ease;
}

/* ── Suggestions ────────────────────────────────────────── */
.suggestions-wrap {
  padding: 0 4px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.chip {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-soft);
  font-family: var(--font);
  font-size: 12.5px;
  font-weight: 500;
  padding: 7px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.chip:hover {
  background: var(--surface2);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Input area ─────────────────────────────────────────── */
.input-area {
  padding: 8px 4px 20px;
  flex-shrink: 0;
}

.input-box {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 10px 10px 10px 18px;
  transition: border-color 0.2s;
}

.input-box:focus-within {
  border-color: rgba(0,230,122,0.35);
}

.input-box textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.6;
  resize: none;
  max-height: 180px;
  min-height: 24px;
  overflow-y: auto;
  padding: 2px 0;
}

.input-box textarea::placeholder { color: var(--text-muted); }

.input-box textarea::-webkit-scrollbar { width: 3px; }
.input-box textarea::-webkit-scrollbar-thumb { background: var(--surface2); }

.send-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: #000;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}

.send-btn:hover:not(:disabled) {
  background: var(--accent-dim);
  transform: scale(1.04);
}

.send-btn:disabled {
  background: var(--surface2);
  color: var(--text-muted);
  cursor: not-allowed;
  transform: none;
}

.send-btn svg { display: block; }

/* ── Welcome screen ─────────────────────────────────────── */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px 40px;
  flex: 1;
}

.welcome-icon {
  width: 56px;
  height: 56px;
  background: var(--accent);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}

.welcome h1 {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.welcome h1 span { color: var(--accent); }

.welcome p {
  font-size: 14px;
  color: var(--text-muted);
  max-width: 380px;
  line-height: 1.6;
}

/* ── Mobile ─────────────────────────────────────────────── */
@media (max-width: 600px) {
  .app { padding: 0 10px; }
  .header { padding: 14px 0 10px; }
  .status-badge span { display: none; }
  .bubble { max-width: 90%; }
  .welcome h1 { font-size: 20px; }
}

/* ── Error toast ────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #ef4444;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: 10px;
  z-index: 999;
  transition: transform 0.3s ease;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 2L15.5 5.75V12.25L9 16L2.5 12.25V5.75L9 2Z" fill="#000" fill-opacity="0.9"/>
          <path d="M9 6L12 7.75V11.25L9 13L6 11.25V7.75L9 6Z" fill="#00e67a"/>
        </svg>
      </div>
      <div class="logo-text">
        <span>HiveRift</span>
        <span>Intelligence Brain</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>Llama-3 · Groq</span>
      </div>
      <button class="btn-ghost" onclick="newChat()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        New chat
      </button>
    </div>
  </header>

  <!-- Messages -->
  <div class="messages" id="messages">
    <!-- Welcome screen shown when no messages -->
    <div class="welcome" id="welcome">
      <div class="welcome-icon">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <path d="M13 3L21.5 7.75V17.25L13 22L4.5 17.25V7.75L13 3Z" fill="#000" fill-opacity="0.85"/>
          <path d="M13 9L17 11.5V16L13 18.5L9 16V11.5L13 9Z" fill="#00e67a"/>
        </svg>
      </div>
      <h1>Hello, I'm <span>HiveRift Brain</span></h1>
      <p>Your AI sales assistant. Ask me about our services, pricing, or how we can help your business grow.</p>
    </div>
  </div>

  <!-- Suggestion chips -->
  <div class="suggestions-wrap" id="suggestions">
    <button class="chip" onclick="askChip('What services does HiveRift offer?')">Our services</button>
    <button class="chip" onclick="askChip('Web development pricing')">Web dev pricing</button>
    <button class="chip" onclick="askChip('UI UX design pricing')">UI/UX pricing</button>
    <button class="chip" onclick="askChip('Digital marketing pricing')">Marketing pricing</button>
    <button class="chip" onclick="askChip('What is the 7 phase sales process?')">Sales process</button>
    <button class="chip" onclick="askChip('Does HiveRift offer discounts?')">Discounts</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-box">
      <textarea
        id="input"
        placeholder="Ask anything about HiveRift…"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 13V3M3 8l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script>
const API_BASE = "https://beastzzz-genhive.hf.space";

const msgsEl    = document.getElementById('messages');
const inputEl   = document.getElementById('input');
const sendBtnEl = document.getElementById('sendBtn');
const suggsEl   = document.getElementById('suggestions');
const welcomeEl = document.getElementById('welcome');

let busy = false;

// ── Enable/disable send button based on input ──────────────────────────────
inputEl.addEventListener('input', () => {
  updateSendBtn();
});

function updateSendBtn() {
  sendBtnEl.disabled = !inputEl.value.trim() || busy;
}

// ── Auto-resize textarea ───────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

// ── Markdown → HTML ────────────────────────────────────────────────────────
function md(text) {
  // Escape HTML first
  let s = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Code blocks ```
  s = s.replace(/```[\s\S]*?```/g, m => {
    const inner = m.replace(/^```\w*\n?/, '').replace(/```$/, '');
    return `<pre style="background:var(--surface2);padding:12px 14px;border-radius:10px;overflow-x:auto;margin:10px 0;font-family:var(--mono);font-size:13px;color:#e8eaf0;">${inner}</pre>`;
  });

  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Bold **text**
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Italic *text*
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');

  // Process lines
  const lines = s.split('\n');
  const out = [];
  let inUl = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const bullet = line.match(/^[\s]*[-•*]\s+(.+)/);
    const numbered = line.match(/^[\s]*\d+\.\s+(.+)/);

    if (bullet) {
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push(`<li>${bullet[1]}</li>`);
    } else if (numbered) {
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push(`<li>${numbered[1]}</li>`);
    } else {
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (line.trim() === '') {
        out.push('<br>');
      } else {
        out.push(`<p>${line}</p>`);
      }
    }
  }
  if (inUl) out.push('</ul>');

  return out.join('');
}

// ── Add message row ────────────────────────────────────────────────────────
function addRow(role) {
  // Hide welcome on first message
  if (welcomeEl) welcomeEl.style.display = 'none';

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'bot' ? 'HR' : 'You';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;

  row.appendChild(avatar);
  row.appendChild(bubble);
  msgsEl.appendChild(row);
  scrollBottom();

  return bubble;
}

// ── Add phase pill ─────────────────────────────────────────────────────────
function addPhasePill(phase) {
  const existing = document.getElementById('phasePill');
  if (existing) existing.remove();

  const pill = document.createElement('div');
  pill.id = 'phasePill';
  pill.className = 'phase-pill';
  pill.innerHTML = `
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
      <circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="5" cy="5" r="1.5" fill="currentColor"/>
    </svg>
    ${phase}
  `;
  msgsEl.appendChild(pill);
  scrollBottom();
}

// ── Show thinking dots ─────────────────────────────────────────────────────
function addThinking() {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'thinking';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  avatar.textContent = 'HR';

  const dots = document.createElement('div');
  dots.className = 'thinking';
  dots.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(avatar);
  row.appendChild(dots);
  msgsEl.appendChild(row);
  scrollBottom();
}

function removeThinking() {
  const el = document.getElementById('thinking');
  if (el) el.remove();
}

function scrollBottom() {
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

// ── Main send ──────────────────────────────────────────────────────────────
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  setBusy(true);

  // User bubble
  const userBubble = addRow('user');
  userBubble.textContent = text;

  // Clear input
  inputEl.value = '';
  inputEl.style.height = 'auto';

  // Thinking dots
  addThinking();

  try {
    const res = await fetch(API_BASE + '/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });

    if (!res.ok) throw new Error(`Server error ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let rawText = '';
    let botBubble = null;
    let cursor = null;
    let firstToken = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const raw = line.slice(5).trim();
        try {
          const payload = JSON.parse(raw);

          if (payload.phase) {
            addPhasePill(payload.phase);
          }

          if (payload.token) {
            if (firstToken) {
              removeThinking();
              botBubble = addRow('bot');
              cursor = document.createElement('span');
              cursor.className = 'streaming-cursor';
              firstToken = false;
            }
            rawText += payload.token;
            botBubble.innerHTML = md(rawText);
            botBubble.appendChild(cursor);
            scrollBottom();
          }

          if (payload.done) {
            if (cursor) cursor.remove();
            if (botBubble) botBubble.innerHTML = md(rawText);
            scrollBottom();
          }
        } catch (_) {}
      }
    }

    // Safety: remove cursor/thinking if still present
    if (cursor) cursor.remove();
    removeThinking();
    if (!botBubble) {
      const b = addRow('bot');
      b.innerHTML = md('Sorry, I did not receive a response. Please try again.');
    }

  } catch (err) {
    removeThinking();
    const b = addRow('bot');
    b.innerHTML = md(`Connection error. Please check if the server is running.\n\n_${err.message}_`);
    showToast('Could not reach server — is the HF Space running?');
  }

  setBusy(false);
}

// ── New chat ───────────────────────────────────────────────────────────────
async function newChat() {
  try { await fetch(API_BASE + '/reset', { method: 'POST' }); } catch (_) {}

  msgsEl.innerHTML = '';

  // Re-show welcome
  const w = document.createElement('div');
  w.id = 'welcome';
  w.className = 'welcome';
  w.innerHTML = `
    <div class="welcome-icon">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M13 3L21.5 7.75V17.25L13 22L4.5 17.25V7.75L13 3Z" fill="#000" fill-opacity="0.85"/>
        <path d="M13 9L17 11.5V16L13 18.5L9 16V11.5L13 9Z" fill="#00e67a"/>
      </svg>
    </div>
    <h1>Hello, I'm <span>HiveRift Brain</span></h1>
    <p>Your AI sales assistant. Ask me about our services, pricing, or how we can help your business grow.</p>
  `;
  msgsEl.appendChild(w);

  suggsEl.style.display = 'flex';
  inputEl.value = '';
  inputEl.style.height = 'auto';
}

// ── Chip click ─────────────────────────────────────────────────────────────
function askChip(text) {
  if (busy) return;
  inputEl.value = text;
  autoResize(inputEl);
  updateSendBtn();
  send();
}

// ── Enter to send (Shift+Enter = newline) ──────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtnEl.disabled) send();
  }
}


// ── Toast error ────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

// ── Busy state ─────────────────────────────────────────────────────────────
function setBusy(val) {
  busy = val;
  inputEl.disabled = val;
  updateSendBtn();
}
</script>

<div class="toast" id="toast"></div>
</body>
</html>
